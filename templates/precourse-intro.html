<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../nexus-transition.js" defer blocking="render"></script>
<script src="../ciro.js"></script>
<title>NEXUS Academy — Pre-Course Intro</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Lexend:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08101f;--card:#0d1628;--card2:#111d30;--box:#16213a;
  --blue:#00c8ff;--blue-dim:rgba(0,200,255,0.07);--blue-border:rgba(0,200,255,0.22);
  --border:#1a2d45;--white:#ffffff;--offwhite:#eaf3fb;--body-text:#cce2f2;
  --muted:#5a8aaa;--label:#2a5a7a;--placeholder:#3a6888;
  --yellow:#ffcc00;--red:#ff4444;--amber:#ffaa00;
  --dot-color:#00c8ff;
}
html{background:var(--bg);color:var(--white);font-size:16px;line-height:1.7}
body{background:var(--bg);min-height:100vh;font-family:'Lexend',sans-serif}

nav{background:var(--card);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 60px;position:sticky;top:0;z-index:100;width:100%}
.wordmark{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;letter-spacing:4px;color:var(--white);text-decoration:none}
.wordmark span{color:var(--blue)}
.nav-module-id{font-family:'Lexend',sans-serif;font-size:13px;font-weight:300;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.nav-back{font-family:'Lexend',sans-serif;font-size:11px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:8px 18px;border-radius:3px;transition:color .2s,border-color .2s}
.nav-back:hover{color:var(--blue);border-color:var(--blue-border)}

.browser-shell{width:1280px;margin:0 auto;background:var(--bg);min-height:calc(100vh - 64px)}
.content-col{max-width:860px;margin:0 auto;padding:52px 0 100px}

.ciro-scene-wrap{
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:8px 8px 0 0;
  background:var(--card);
  overflow:hidden;
  position:relative;
  height:280px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
}
.ciro-scene-wrap::after{
  content:'';
  position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,200,255,0.018) 3px,rgba(0,200,255,0.018) 4px);
  pointer-events:none;
}
.ciro-scene-floor{
  position:absolute;
  bottom:54px;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,200,255,0.18),transparent);
}
.ciro-stage{
  position:relative;
  will-change:transform;
  transform:translateX(-200px);
}
.ciro-svg-outer{display:block;transition:transform 0.0s}
.ciro-tx-panel{
  border:1px solid var(--border);
  border-top:none;
  border-radius:0 0 8px 8px;
  background:var(--card2);
  padding:32px 40px 36px;
  position:relative;
}
.ciro-tx-panel::before{
  content:'';
  position:absolute;top:0;left:40px;right:40px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,200,255,0.35),transparent);
}
.tx-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--label);text-transform:uppercase;margin-bottom:18px}
.tx-name{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:900;letter-spacing:4px;color:var(--blue);margin-bottom:22px}
.ciro-line{font-family:'IBM Plex Mono',monospace;font-size:15px;line-height:1.9;color:var(--offwhite);margin-bottom:22px;min-height:1.9em}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}
.tx-sep{height:1px;background:linear-gradient(90deg,var(--blue),transparent);opacity:0;margin:6px 0 28px;transition:opacity 0.8s ease;max-width:280px}
.tx-sep.visible{opacity:0.4}
.begin-btn{
  display:inline-flex;align-items:center;gap:12px;
  font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:3px;text-transform:uppercase;
  color:var(--blue);background:transparent;border:1px solid var(--blue-border);border-radius:3px;
  padding:14px 32px;cursor:pointer;opacity:0;transform:translateY(8px);
  transition:opacity 0.7s ease,transform 0.7s ease,background 0.2s,border-color 0.2s;
  text-decoration:none;margin-top:4px;
}
.begin-btn.visible{opacity:1;transform:translateY(0);animation:btn-pulse 2s ease-in-out infinite}
.begin-btn:not(.visible){visibility:hidden;pointer-events:none}
.begin-btn:hover{background:var(--blue-dim);border-color:var(--blue);animation:none;box-shadow:0 0 18px rgba(0,200,255,0.35)}
@keyframes btn-pulse{
  0%,100%{border-color:rgba(0,200,255,0.22);box-shadow:0 0 0 rgba(0,200,255,0)}
  50%{border-color:rgba(0,200,255,0.9);box-shadow:0 0 14px rgba(0,200,255,0.4),0 0 28px rgba(0,200,255,0.15)}
}
.begin-arrow{transition:transform .2s}
.begin-btn:hover .begin-arrow{transform:translateX(5px)}
.da{animation:bl 2s infinite}
.db{animation:bl 2s .65s infinite}
.dc{animation:bl 2s 1.3s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0.2}}
.scene-module-tag{position:absolute;top:20px;right:24px;font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:4px;color:rgba(0,200,255,0.4);text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>

<nav>
  <a href="../hub.html" class="wordmark">NEXUS <span>ACADEMY</span></a>
  <div class="nav-module-id">Welcome to Pre-Course</div>
  <a href="../hub.html" class="nav-back">← Hub</a>
</nav>

<div class="browser-shell">
<div class="content-col">

  <div class="ciro-scene-wrap" id="ciro-scene">
    <div class="ciro-scene-floor"></div>
    <div class="scene-module-tag">Pre-Course</div>

    <div class="ciro-stage" id="ciro-stage">
      <div class="ciro-svg-outer" id="ciro-body">
        
      </div>
    </div>
  </div>

  <div class="ciro-tx-panel">
    <div id="ciro-lines"></div>
    <div class="tx-sep" id="tx-sep"></div>
    <a href="{{BEGIN_HREF}}" class="begin-btn" id="begin-btn" onclick="var _a=new Audio('../audio/sfx/password-confirm.mp3');_a.volume=0.1;_a.play().catch(function(){})">
      Begin Pre-Course <span class="begin-arrow">→</span>
    </a>
  </div>

</div>
</div>

<script>
const CIRO_LINES = [
{{CIRO_LINES_JS}}
];

const LIGHT_MODE = 'blue';

const stage     = document.getElementById('ciro-stage');
const body      = document.getElementById('ciro-body');
const linesEl   = document.getElementById('ciro-lines');
const txSep     = document.getElementById('tx-sep');
const beginBtn  = document.getElementById('begin-btn');

const SCENE_W   = document.getElementById('ciro-scene').offsetWidth;
const TARGET_X  = Math.round(SCENE_W * 0.44);
const ciro = NXCiro.mount(body, {width:86});
ciro.place(-200);

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

function setDotColor(color){ ciro.color(color); }

async function rollIn(){ if(document.readyState==='loading') await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true})); const w=document.getElementById('ciro-scene').offsetWidth; await ciro.rollTo(Math.round((w-86)/2), {ms:1600}); }

async function headTurn(){ await ciro.tilt(-14, 560); await ciro.tilt(0, 440); }

async function bodyPivot(){ await ciro.wave(); }

// Typewriter that never moves layout. The whole text is laid out up front with the untyped part
// visibility:hidden, so each line wraps and sizes exactly as it will when finished and the panel
// stays one size. The cursor has zero advance and is glued to the letters either side of it, so
// it can never introduce a line break in the middle of a word.
const TW_WORD = /[\p{L}\p{N}'’]/u;
function twMount(el, content, asHTML){
  if(asHTML) el.innerHTML = content; else el.textContent = content;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while(w.nextNode()) nodes.push(w.currentNode);
  const segs = nodes.map(n => {
    const typed = document.createTextNode(''), glue = document.createElement('span'), gl = document.createTextNode(''),
          gr = document.createElement('span'), rest = document.createElement('span');
    glue.style.whiteSpace = 'nowrap'; gr.style.visibility = 'hidden'; rest.style.visibility = 'hidden';
    glue.append(gl, gr); rest.textContent = n.data; n.replaceWith(typed, glue, rest);
    return { text: n.data, typed, glue, gl, gr, rest };
  });
  return { el, content, asHTML, segs };
}
function twShow(st, i, cursor){
  let off = 0, placed = false;
  st.segs.forEach((s, idx) => {
    const n = s.text.length, k = Math.max(0, Math.min(n, i - off));
    if(cursor && !placed && (i < off + n || idx === st.segs.length - 1)){
      placed = true;
      const gL = k > 0 && TW_WORD.test(s.text.charAt(k - 1)), gR = k < n && TW_WORD.test(s.text.charAt(k));
      s.typed.data = s.text.slice(0, gL ? k - 1 : k); s.gl.data = gL ? s.text.charAt(k - 1) : '';
      s.glue.insertBefore(cursor, s.gr); s.gr.textContent = gR ? s.text.charAt(k) : ''; s.rest.textContent = s.text.slice(gR ? k + 1 : k);
    } else {
      s.typed.data = s.text.slice(0, k); s.gl.data = ''; s.gr.textContent = ''; s.rest.textContent = s.text.slice(k);
    }
    off += n;
  });
}
function twDone(st){ if(st.asHTML) st.el.innerHTML = st.content; else st.el.textContent = st.content; }

// Every line is in place (invisible) from the first frame, so the panel never grows.
const lineStates = CIRO_LINES.map(({ text }) => {
  const lineEl = document.createElement('div');
  lineEl.className = 'ciro-line';
  linesEl.appendChild(lineEl);
  return twMount(lineEl, text);
});

async function typeLine(st, text){
  const cursor = document.createElement('span');
  cursor.style.cssText = 'display:inline-block;width:8px;height:14px;background:#00c8ff;vertical-align:middle;margin-left:2px;margin-right:-10px;animation:cur .7s step-end infinite';
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    twShow(st, i + 1, cursor);
    let d = 32;
    if(ch === '.') d += 110;
    else if(ch === ',') d += 55;
    else if(ch === '—') d += 70;
    else if(ch === ':') d += 50;
    await wait(d);
  }
  cursor.remove();
  twDone(st);
}

async function runTransmission(){
  await wait(600);
  for(let n = 0; n < CIRO_LINES.length; n++){
    const { text, pauseAfter } = CIRO_LINES[n];
    await typeLine(lineStates[n], text);
    await wait(pauseAfter);
  }
  await wait(350);
  txSep.classList.add('visible');
  await wait(500);
  beginBtn.classList.add('visible');
}

async function runScene(){
  setDotColor('#00c8ff');
  await rollIn();
  await wait(280);
  await headTurn();
  await wait(180);
  await bodyPivot();
  await wait(400);
  runTransmission();
}

runScene();
(function(){
  const nav=localStorage.getItem('nexus_sfx_nav');
  if(!nav)return;
  try{
    const {file,ts}=JSON.parse(nav);
    localStorage.removeItem('nexus_sfx_nav');
    const elapsed=(Date.now()-ts)/1000;
    const a=new Audio('../'+file);
    a.volume=0.1;a.currentTime=Math.min(elapsed,2.5);
    a.play().catch(()=>{});
  }catch(e){}
})();
(function(){window._ciroSong=new Audio("../audio/music/ciro-intro.mp3");window._ciroSong.loop=true;window._ciroSong.volume=0.18;window._ciroSong.play().catch(function(){document.addEventListener("click",function h(){window._ciroSong.play().catch(function(){});document.removeEventListener("click",h);});});window.addEventListener("pageshow",function(e){if(e.persisted)window._ciroSong.play().catch(function(){});});})();
</script>
<script>(function(){var op=localStorage.getItem('nexus_current_operator')||'operator';var hu='../hub.html';document.querySelectorAll('a[href*="hub.html"]').forEach(function(a){a.href=hu;});})();</script>
</body>
</html>
